meta:
  environment: node
  toolchain:
    name: npm
    version: "20"
build:
  skip: false
  additionalCommands:
    - npm ci
    - npm run build
run:
  command: node -e "require('http').createServer((req,res)=>{const fs=require('fs');const path=require('path');let f=path.join('dist',req.url==='/'?'index.html':req.url);fs.readFile(f,(e,d)=>{res.end(d||'')})}).listen(80)"
  persistenceMount: /data
  containerPort: "80"
  servicePort: 80